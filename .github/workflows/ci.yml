name: Verify DB EX
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Typecheck, security, database integration, UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbex-test
          MYSQL_ROOT_HOST: '%'
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdbex-test"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mongodb:
        image: mongo:7
        ports: ['127.0.0.1:27017:27017', '127.0.0.1:27018:27018', '127.0.0.1:27019:27019', '127.0.0.1:27020:27020']
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['127.0.0.1:6379:6379', '127.0.0.1:6380:6380', '127.0.0.1:6381:6381', '127.0.0.1:26379:26379', '127.0.0.1:7000:7000', '127.0.0.1:7001:7001', '127.0.0.1:7002:7002']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - name: Start isolated MongoDB replica set
        run: bash scripts/start-mongo-replica.sh "${{ job.services.mongodb.id }}"
      - name: Start isolated Redis Cluster and Sentinel
        run: bash scripts/start-redis-topologies.sh "${{ job.services.redis.id }}"
      - run: npm test
        env:
          DB_EX_INTEGRATION: '1'
          DB_EX_TOPOLOGY: '1'
          MYSQL_URL: mysql://root:dbex-test@127.0.0.1:3306
          MONGODB_URI: mongodb://127.0.0.1:27017
          REDIS_URL: redis://127.0.0.1:6379
      - name: Verify native MySQL and MongoDB backup/restore against isolated databases
        run: bash scripts/test-native-tools-docker.sh
        env:
          DB_EX_TEST_MONGO_IMAGE: mongo:7
      - run: npm run build
      - name: SQLite isolated process cancellation and rollback
        run: node scripts/test-sqlite-process.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: failure()
        with:
          name: ui-failure-evidence
          path: test-results/
          retention-days: 7
  packages:
    name: Desktop package (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Build macOS ad-hoc signed preview / other desktop installers
        run: npm exec electron-builder -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' && 'true' || 'false' }}
      - name: Verify macOS app code signature and custom icon
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-package.sh
      - name: Real Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:electron
        env:
          DB_EX_PACKAGED: '1'
      - name: Real Electron smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run smoke:electron
        env:
          DB_EX_PACKAGED: '1'
      - name: Verify installer files and record hashes
        run: node scripts/check-packages.mjs
      # Upload delivery is optional: the account may have exhausted its Actions storage quota.
      # Typecheck, integration, UI, installer generation, hashes and packaged smoke stay required.
      - name: Upload installers (requires Actions storage)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: db-ex-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: electron-smoke-${{ runner.os }}
          path: electron-smoke.png
          if-no-files-found: ignore
          retention-days: 7
