name: Finalize DB EX v0.5.0 after direct asset uploads
on:
  workflow_run:
    workflows: ["Publish DB EX v0.5.0"]
    types: [completed]
permissions:
  contents: write
jobs:
  finalize:
    # This is a one-time guard for the original merge commit. The release uploader
    # sanitizes spaces in asset names to dots, which the original finalizer omitted.
    if: >-
      github.repository == 'xzcode/db-ex' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_sha == 'af576492d5627bde5d9f15aacda96f4a4224b0e7' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify draft tag and assets then publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag_sha="$(gh api "repos/$repo/git/ref/tags/v0.5.0" --jq '.object.sha')"
          [[ "$tag_sha" == "af576492d5627bde5d9f15aacda96f4a4224b0e7" ]] || { echo "::error::Tag does not point to the verified merge"; exit 1; }
          is_draft="$(gh release view v0.5.0 --repo "$repo" --json isDraft --jq '.isDraft')"
          [[ "$is_draft" == "true" ]] || { echo "::error::Release is not draft"; exit 1; }
          payload="$(gh api "repos/$repo/releases/tags/v0.5.0")"
          names="$(jq -r '.assets[].name' <<<"$payload")"
          for filename in 'DB.EX-0.5.0-mac-arm64.dmg' 'DB.EX-0.5.0-mac-arm64.zip' 'DB.EX-0.5.0-win-x64.exe' 'DB.EX-0.5.0-linux-x86_64.AppImage' 'DB.EX-0.5.0-linux-amd64.deb' 'SHA256SUMS-macOS-ARM64.txt' 'SHA256SUMS-Windows-X64.txt' 'SHA256SUMS-Linux-X64.txt'; do
            if ! grep -Fqx -- "$filename" <<<"$names"; then
              echo "::error::Missing required release asset: $filename"
              exit 1
            fi
          done
          bad="$(jq -r '.assets[] | select((.state != "uploaded") or (.size < 1048576 and (.name | endswith(".txt") | not))) | .name' <<<"$payload")"
          [[ -z "$bad" ]] || { echo "::error::Incomplete or unexpectedly small release asset: $bad"; exit 1; }
          gh release edit v0.5.0 --repo "$repo" --draft=false --prerelease
          echo "Release v0.5.0 published with 5 installers and 3 SHA-256 files."
